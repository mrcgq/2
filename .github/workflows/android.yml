name: Build Xlink Android

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK & AAR
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          
      - name: Auto-fetch hev-socks5-tunnel C Source
        run: |
          echo "🚀 正在拉取 hev-socks5-tunnel 稳定发行版 C 源码 (v2.6.8)..."
          rm -rf app/src/main/jni/hev-socks5-tunnel
          git clone --depth 1 --branch 2.6.8 --recursive https://github.com/heiher/hev-socks5-tunnel app/src/main/jni/hev-socks5-tunnel
          echo "✅ C 源码拉取完成，准备编译！"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: core-go/go.sum

      - name: Install Android NDK r26d
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.3.11579264" \
            "build-tools;35.0.0" \
            "platforms;android-35"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Initialize gomobile
        run: |
          gomobile init
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Prepare libs directory
        run: mkdir -p app/libs

      - name: Build core.aar
        working-directory: core-go
        run: |
          go mod tidy
          go mod download
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile bind \
            -target=android \
            -androidapi=26 \
            -o ../app/libs/core.aar \
            ./core
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Verify core.aar
        run: |
          test -f app/libs/core.aar || (echo "::error::core.aar missing!" && exit 1)
          echo "✅ core.aar compiled successfully"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Ensure Gradle Wrapper exists
        run: |
          if [ ! -f "gradlew" ]; then
            echo "⚡ 未检测到 gradlew，正在自动生成 Gradle Wrapper..."
            gradle wrapper --gradle-version 8.11.1
          fi

      - name: Grant gradlew permission
        run: chmod +x gradlew

      - name: Generate version info
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Build target version: ${VERSION}"

      - name: Validate Release Signing Configuration
        run: |
          if [ -z "${{ secrets.KEYSTORE_PATH }}" ] && [ -z "$KEYSTORE_PATH" ]; then
            echo "::warning title=Keystore Warning::未检测到 KEYSTORE_PATH 环境变量！Release APK 将使用本地 Debug 密钥兜底签名。"
          fi
          
      - name: Ensure Debug Keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            -PversionName="${{ steps.version.outputs.version }}" \
            --no-daemon \
            --stacktrace

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -PversionName="${{ steps.version.outputs.version }}" \
            --no-daemon \
            --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: xlink-debug-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: xlink-release-${{ steps.version.outputs.version }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Xlink Android ${{ steps.version.outputs.version }}"
          body: |
            ## Xlink Android ${{ steps.version.outputs.version }}
            - 增强功能完整版（测速 + 分应用代理 + 状态栏磁贴 + 剪贴板快速导入）
            - 核心网络链路保持稳定
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}